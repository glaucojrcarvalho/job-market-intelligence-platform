version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-market-api
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://job_market:job_market@db:5432/job_market
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps:/app/apps
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  db:
    image: postgres:16-alpine
    container_name: job-market-db
    environment:
      POSTGRES_DB: job_market
      POSTGRES_USER: job_market
      POSTGRES_PASSWORD: job_market
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_market -d job_market"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
